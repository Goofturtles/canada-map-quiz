<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practise naming the provinces, cities and water bodies of Canada on a blank map.">
  <title>Canada map check-in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23d0202e' stroke='%23fff' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Canada map check-in</h1>
    <div class="modes" role="group" aria-label="Mode">
      <span class="pill"></span>
      <button type="button" data-mode="study">Study</button>
      <button type="button" data-mode="practice">Practice</button>
      <button type="button" data-mode="test">Mock test</button>
    </div>
    <p class="progress">
      <span id="progress" title="Nailed = typed right twice in a row (multiple choice does not count)"></span>
      <button type="button" class="link" id="reset">Reset</button>
    </p>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Map">
      <svg id="map" viewBox="0 0 1200 930" role="group" aria-label="Map of Canada with points to identify"></svg>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zreset">Whole map</button>
      </div>
    </section>
    <section class="panel" id="panel" aria-label="Answers and settings"></section>
  </main>

  <!-- Everything is local, so the page works with no internet. map.js is built by tools/build-map.js. -->
  <script src="vendor/d3.min.js"></script>
  <script src="map.js"></script>
  <script src="data.js"></script>
  <script src="rivers.js"></script>
  <script src="app.js"></script>
</body>
</html>
